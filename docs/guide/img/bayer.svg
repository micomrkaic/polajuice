<text x="350.0" y="294.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">what you get: three per pixel, two of them estimated</text>
<text x="596.0" y="66.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Half the pixels see</text>
<text x="596.0" y="84.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">green, a quarter red,</text>
<text x="596.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">a quarter blue.</text>
<text x="596.0" y="120.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal"></text>
<text x="596.0" y="138.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">The two missing colors</text>
<text x="596.0" y="156.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">at each pixel are</text>
<text x="596.0" y="174.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">estimated from its</text>
<text x="596.0" y="192.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">neighbors. Fine detail</text>
<text x="596.0" y="210.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">and hard edges are</text>
<text x="596.0" y="228.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">where the guess shows:</text>
<text x="596.0" y="246.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">color fringes and moiré.</text>

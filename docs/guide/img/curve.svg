<text x="364.0" y="163.2" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">shoulder</text>
<text x="364.0" y="179.2" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">highlights roll off</text>

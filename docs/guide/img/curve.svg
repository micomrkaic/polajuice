<text x="82.0" y="180.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">toe</text>
<text x="82.0" y="196.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">shadows crowd</text>
<text x="82.0" y="210.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">together</text>
<line x1="100.0" y1="218.0" x2="112.0" y2="292.0" stroke="#52514e" stroke-width="1.2"/>
<line x1="112.0" y1="292.0" x2="106.8" y2="285.9" stroke="#52514e" stroke-width="1.2"/>

<text x="568.0" y="74.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">normal development</text>
<line x1="520.0" y1="96.0" x2="560.0" y2="96.0" stroke="#eb6834" stroke-width="2.2" stroke-dasharray="7 4"/>
<text x="568.0" y="100.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">steeper: a push, or</text>
<text x="568.0" y="116.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">--contrast above 0</text>
<line x1="520.0" y1="138.0" x2="560.0" y2="138.0" stroke="#52514e" stroke-width="1.0" stroke-dasharray="2 4"/>
<text x="568.0" y="142.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">a straight copy</text>
<text x="520.0" y="182.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Read it left to right: how bright</text>
<text x="520.0" y="200.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the scene was, and how bright the</text>
<text x="520.0" y="218.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">film made it. Where the curve is</text>
<text x="520.0" y="236.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">steep, tones are pulled apart;</text>
<text x="520.0" y="254.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">where it is flat, they merge.</text>
<text x="520.0" y="272.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Digital sensors have no shoulder:</text>
<text x="520.0" y="290.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">they are a straight line that</text>
<text x="520.0" y="308.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">stops dead at white.</text>

<text x="309.4" y="236.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">straight part</text>
<text x="309.4" y="252.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">its slope is the contrast</text>
<line x1="305.2" y1="224.8" x2="288.4" y2="185.6" stroke="#52514e" stroke-width="1.2"/>
<line x1="288.4" y1="185.6" x2="294.9" y2="190.3" stroke="#52514e" stroke-width="1.2"/>

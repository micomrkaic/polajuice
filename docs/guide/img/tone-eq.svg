<text x="569.0" y="66.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">the film alone</text>
<line x1="525.0" y1="86.0" x2="561.0" y2="86.0" stroke="#2a78d6" stroke-width="2.2"/>
<text x="569.0" y="90.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">with the two bands</text>
<line x1="525.0" y1="110.0" x2="561.0" y2="110.0" stroke="#eb6834" stroke-width="2.0"/>
<text x="569.0" y="114.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">the bands themselves</text>
<text x="525.0" y="150.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Band 1 lifts the deep shadows:</text>
<text x="525.0" y="167.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">+1.2 stops, centered four stops</text>
<text x="525.0" y="184.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">under middle gray, 1.5 stops</text>
<text x="525.0" y="201.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">wide. Band 4 cuts the highlights:</text>
<text x="525.0" y="218.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">-0.7 stops, two stops over, one</text>
<text x="525.0" y="235.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">wide.</text>
<text x="525.0" y="252.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal"></text>
<text x="525.0" y="269.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Each handle sits on the curve at</text>
<text x="525.0" y="286.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">its band&#x27;s center; the bar through</text>
<text x="525.0" y="303.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">it is the band&#x27;s width. Between</text>
<text x="525.0" y="320.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">the bands the curve is untouched.</text>
<text x="525.0" y="356.0" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal">--tone1 1.2 --tone1width 1.5</text>
<text x="525.0" y="371.0" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="normal">--tone4 -0.7</text>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="DejaVu Sans,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="20.0" y="24.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">The order of work: light, camera, film, darkroom</text>
<rect x="20.0" y="50.0" width="130.0" height="172.0" rx="6" fill="#f3f2ee" stroke="#d9d8d2"/>
<rect x="20.0" y="50.0" width="130.0" height="30.0" rx="6" fill="#184f95"/>
<text x="30.0" y="70.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">1  The frame</text>
<text x="30.0" y="106.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">read: JPEG, PNG, raw…</text>
<text x="30.0" y="128.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">denoise, sharpen</text>
<text x="30.0" y="150.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">straighten, keystone</text>
<text x="30.0" y="172.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">distortion, corners</text>
<text x="30.0" y="194.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">trim, frame shape</text>
<line x1="152.0" y1="65.0" x2="165.0" y2="65.0" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="165.0" y1="65.0" x2="158.1" y2="69.1" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="165.0" y1="65.0" x2="158.1" y2="60.9" stroke="#0b0b0b" stroke-width="1.2"/>
<rect x="167.0" y="50.0" width="130.0" height="172.0" rx="6" fill="#f3f2ee" stroke="#d9d8d2"/>
<rect x="167.0" y="50.0" width="130.0" height="30.0" rx="6" fill="#184f95"/>
<text x="177.0" y="70.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">2  The scene</text>
<text x="177.0" y="106.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">white balance</text>
<text x="177.0" y="128.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">grad, radial filter</text>
<text x="177.0" y="150.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">exposure (--ev)</text>
<text x="177.0" y="172.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">black, shadows,</text>
<text x="177.0" y="194.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">contrast; lens filter</text>
<line x1="299.0" y1="65.0" x2="312.0" y2="65.0" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="312.0" y1="65.0" x2="305.1" y2="69.1" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="312.0" y1="65.0" x2="305.1" y2="60.9" stroke="#0b0b0b" stroke-width="1.2"/>
<rect x="314.0" y="50.0" width="130.0" height="172.0" rx="6" fill="#f3f2ee" stroke="#d9d8d2"/>
<rect x="314.0" y="50.0" width="130.0" height="30.0" rx="6" fill="#184f95"/>
<text x="324.0" y="70.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">3  The camera</text>
<text x="324.0" y="106.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">flash</text>
<text x="324.0" y="128.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">lens softness</text>
<text x="324.0" y="150.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">vignette</text>
<text x="324.0" y="172.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">halation</text>
<line x1="446.0" y1="65.0" x2="459.0" y2="65.0" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="459.0" y1="65.0" x2="452.1" y2="69.1" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="459.0" y1="65.0" x2="452.1" y2="60.9" stroke="#0b0b0b" stroke-width="1.2"/>
<rect x="461.0" y="50.0" width="130.0" height="172.0" rx="6" fill="#f3f2ee" stroke="#d9d8d2"/>
<rect x="461.0" y="50.0" width="130.0" height="30.0" rx="6" fill="#184f95"/>
<text x="471.0" y="70.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">4  The film</text>
<text x="471.0" y="106.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">color and tone:</text>
<text x="471.0" y="128.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">the film stock (-f),</text>
<text x="471.0" y="150.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">or built-in color</text>
<text x="471.0" y="172.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">edge effects</text>
<text x="471.0" y="194.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">silver grain</text>
<line x1="593.0" y1="65.0" x2="606.0" y2="65.0" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="606.0" y1="65.0" x2="599.1" y2="69.1" stroke="#0b0b0b" stroke-width="1.2"/>
<line x1="606.0" y1="65.0" x2="599.1" y2="60.9" stroke="#0b0b0b" stroke-width="1.2"/>
<rect x="608.0" y="50.0" width="130.0" height="172.0" rx="6" fill="#f3f2ee" stroke="#d9d8d2"/>
<rect x="608.0" y="50.0" width="130.0" height="30.0" rx="6" fill="#184f95"/>
<text x="618.0" y="70.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">5  The darkroom</text>
<text x="618.0" y="106.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">print stock</text>
<text x="618.0" y="128.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">push, pull, cross</text>
<text x="618.0" y="150.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">age</text>
<text x="618.0" y="172.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">classic grain</text>
<text x="618.0" y="194.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">instant-print border</text>
<text x="20.0" y="252.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Everything in 1 and 2 happens to the light before it reaches the film, so the film responds to it</text>
<text x="20.0" y="268.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">as it would have in the camera. Everything in 5 happens to the developed film.</text>
<text x="20.0" y="300.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">The order of the options on the command line does not matter: this order is fixed.</text>
</svg>
